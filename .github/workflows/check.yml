# Runs `make check`, the definition of green: proto lint + breaking, lint (Go + app), tests, coverage gates,
# audit (govulncheck, licenses, tidy, npm audit, gitleaks), build and fleetlint; then the Go suite again on
# Postgres and MariaDB (`make check` itself tests on SQLite); plus an image build without push.
# release.yml calls this workflow as the gate before it publishes an image from a v* tag.
# Actions are pinned to commit SHAs and service images to digests; Renovate keeps the pins current.
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: catches new vulnerabilities in unchanged code

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The supported server databases besides SQLite. Throwaway instances: the credentials below exist only
    # inside this job, and the data lives in memory (every test creates and migrates a database of its own,
    # which is slow on a disk that honours each DDL fsync). MariaDB is pinned to an exact release, the one
    # the docs name as tested.
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: beehive
          POSTGRES_PASSWORD: beehive
          POSTGRES_DB: beehive
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U beehive -d beehive"
          --health-interval 5s --health-timeout 5s --health-retries 24
      mariadb:
        image: mariadb:13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
        env:
          MARIADB_ROOT_PASSWORD: beehive
          MARIADB_DATABASE: beehive
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history; buf breaking needs the previous tag
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: gitleaks, pinned and checksum-verified
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: v8.30.1
        run: |
          set -euo pipefail
          v=${GITLEAKS_VERSION#v}
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL "${base}/gitleaks_${v}_checksums.txt" | grep " gitleaks_${v}_linux_x64.tar.gz$" | sha256sum -c -
          sudo tar -xzf "gitleaks_${v}_linux_x64.tar.gz" -C /usr/local/bin gitleaks
          rm "gitleaks_${v}_linux_x64.tar.gz"
      - name: Go tools and buf (pinned in the Makefile)
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make check
      # Runs even when `make check` failed, so one push reports both. The make targets set the per-package
      # test timeout (DB_TEST_TIMEOUT); with the in-memory data directories above a run takes seconds.
      - name: Go tests on Postgres and MariaDB
        if: ${{ !cancelled() }}
        env:
          PG_DSN: postgres://beehive:beehive@127.0.0.1:5432/beehive?sslmode=disable
          MARIADB_DSN: root:beehive@tcp(127.0.0.1:3306)/beehive
        run: |
          make test-postgres
          make test-mariadb

  # The image build must stay green on every PR; only release.yml pushes.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
