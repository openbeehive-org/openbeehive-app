# Publishes the single-binary image on a v* tag, after `make check` (check.yml) is green.
#
# Registry: ghcr.io/openbeehive-org/openbeehive-app (tags: <version>, <major>.<minor>, latest)
# Auth: the built-in GITHUB_TOKEN (packages: write); the package grants this repository write access.
#
# Supply chain: the pushed image carries BuildKit SLSA provenance + SBOM attestations, is signed keyless
# with cosign (Fulcio cert bound to this workflow's OIDC identity, logged in Rekor), and gets a GitHub
# provenance attestation (`gh attestation verify`). Verify with:
#   cosign verify ghcr.io/openbeehive-org/openbeehive-app:<tag> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/openbeehive-org/openbeehive-app/\.github/workflows/release\.yml@.*'
# The GitHub release carries the SBOM (SPDX JSON) and release notes: the tag message (the CHANGELOG section) plus the commit list.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/openbeehive-org/openbeehive-app

jobs:
  # Gate: `make check` must be green before an image is built.
  check:
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository] -- the documented relative form

  image:
    name: Build, push, sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    # id-token/attestations only here — the check job stays unprivileged.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build & push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # BuildKit-level SLSA provenance + SBOM, attached to the image index.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless sigstore signing — one signature on the pushed digest covers every tag.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign "${IMAGE}@${DIGEST}"

      # GitHub-native provenance attestation (Attestations tab, `gh attestation verify`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the notes step diffs against the previous tag.
          fetch-depth: 0
          persist-credentials: false

      # SBOM of the released image (SPDX JSON), attached to the release.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: SBOM
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: syft "${IMAGE}@${DIGEST}" -o spdx-json > "openbeehive-app-${GITHUB_REF_NAME}.spdx.json"

      - name: Build release notes from commits
        id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo 'body<<NOTES_EOF'
            # subject+body only — %(contents) would embed the tag's SSH signature
            git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME"
            echo
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME"
            echo
            echo '## Changes'
            git log --no-merges --format='- %s (%h)' "${prev:+$prev..}$GITHUB_REF_NAME"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.notes.outputs.body }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$BODY" --generate-notes openbeehive-app-*.spdx.json
