syntax = "proto3";

package openbeehive.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "openbeehive/v1/common.proto";
import "openbeehive/v1/photo.proto";

// Who recorded an inspection. Sensor readings (a hive scale, a climate probe)
// are measurements, not visits: they appear in charts but do not count as
// "last inspected", are left out of the due list and of the dashboard's
// recent inspections.
enum InspectionSource {
  INSPECTION_SOURCE_UNSPECIFIED = 0; // treated as MANUAL
  INSPECTION_SOURCE_MANUAL = 1;      // a person visited the hive
  INSPECTION_SOURCE_SENSOR = 2;      // an automated reading
}

// An inspection / a visit to a hive.
//
// Counts, amounts and climate readings are optional: unset means "not
// recorded", which is different from an observed 0.
message Inspection {
  string id = 1;
  string organization_id = 2;
  string hive_id = 3;
  google.protobuf.Timestamp date = 4;
  string weather = 5;
  bool queen_seen = 6;
  bool eggs_seen = 7;
  Temperament temperament = 8;
  optional int32 frames = 9; // occupied frames
  Stores stores = 10;
  optional int32 queen_cells = 11;
  string varroa = 12;   // e.g. "3 mites/day debris count"
  optional double honey_kg = 13; // harvested during this inspection (superseded by Harvest records)
  string note = 14;
  // Inline photos written by 0.4.x apps, as data URLs. Kept for those apps;
  // read `photos` instead, which lists these and every other photo.
  repeated string photo_keys = 15;
  google.protobuf.Timestamp created_at = 16;

  // Stockkarte detail: colony state, a calmness/steadiness rating (Wabensitz)
  // and the activities done during this visit.
  optional int32 brood_frames = 17;   // frames carrying brood
  int32 calmness = 18;         // steadiness on the comb (Wabensitz), 1..4
  optional double fed_kg = 19;        // feed given during this visit
  optional int32 frames_added = 20;   // frames / foundation added
  optional int32 frames_removed = 21; // frames removed
  bool drone_frame_cut = 22;   // drone brood frame cut out (varroa control)
  bool super_added = 23;       // honey super added
  optional double weight_kg = 24;     // hive weight at this visit
  optional int32 youngest_larva = 25; // age in days of the youngest larva seen (swarm timing)
  bool covered_larva = 26;     // capped/sealed brood seen

  // Climate readings (optional): temperature in °C and relative humidity in %,
  // measured inside the hive and outside. Well suited to automated sensor feeds.
  optional double temp_hive = 27;
  optional double temp_outside = 28;
  optional double humidity_hive = 29;
  optional double humidity_outside = 30;

  InspectionSource source = 31;

  repeated Photo photos = 32; // oldest first; output only
}

// The server freezes the context (apiary and reigning queen at `date`) and
// records an INSPECTION event, exactly as the app does for a visit.
// Optional fields that are not sent are stored as "not recorded".
message CreateInspectionRequest {
  string hive_id = 1;
  google.protobuf.Timestamp date = 2; // unset = now
  string weather = 3;
  bool queen_seen = 4;
  bool eggs_seen = 5;
  Temperament temperament = 6;
  optional int32 frames = 7;
  Stores stores = 8;
  optional int32 queen_cells = 9;
  string varroa = 10;
  optional double honey_kg = 11;
  string note = 12;
  optional double temp_hive = 13;
  optional double temp_outside = 14;
  optional double humidity_hive = 15;
  optional double humidity_outside = 16;
  // Stock card details (see Inspection for the meaning of each field).
  optional int32 brood_frames = 17;
  int32 calmness = 18;
  optional double fed_kg = 19;
  optional int32 frames_added = 20;
  optional int32 frames_removed = 21;
  bool drone_frame_cut = 22;
  bool super_added = 23;
  optional double weight_kg = 24;
  optional int32 youngest_larva = 25;
  bool covered_larva = 26;
  InspectionSource source = 27; // unset = MANUAL; integrations feeding readings set SENSOR
}
message CreateInspectionResponse { Inspection inspection = 1; }

// Newest first. source filters by who recorded the entry: unset returns
// everything, MANUAL only visits by a person, SENSOR only automated readings.
message ListInspectionsRequest {
  PageRequest page = 1;
  string hive_id = 2;
  InspectionSource source = 3;
}
message ListInspectionsResponse {
  repeated Inspection inspections = 1;
  PageResponse page = 2;
}

// Corrects the inspection named by inspection.id: only the fields sent are
// changed.
//
// With update_mask, exactly the listed fields are written (paths: every
// Inspection field except id, organization_id, hive_id, photo_keys, photos
// and created_at), including to their zero value; an optional field that is in
// the mask but unset is cleared to "not recorded". Without update_mask, the
// optional fields that are set and every other field that is not at its
// zero value are written.
//
// date must be set when it is updated; a request that would change nothing
// is rejected (invalid_argument). The INSPECTION timeline event follows a
// changed date. Photos are changed with Add/RemoveInspectionPhoto.
message UpdateInspectionRequest {
  Inspection inspection = 1;
  google.protobuf.FieldMask update_mask = 2;
}
message UpdateInspectionResponse { Inspection inspection = 1; }

// Deleting an inspection also removes its INSPECTION timeline event.
message DeleteInspectionRequest { string id = 1; }
message DeleteInspectionResponse {}

// Adds a photo to an inspection. The image is passed as a data URL (JPEG, PNG
// or WebP, at most 5 MiB decoded); the server stores it as a Photo with a
// thumbnail and returns the inspection with its photos. Adding the same
// image twice has no further effect.
message AddInspectionPhotoRequest {
  string inspection_id = 1;
  string photo = 2; // data URL, e.g. "data:image/jpeg;base64,..."
}
message AddInspectionPhotoResponse { Inspection inspection = 1; }
// Deletes a photo of an inspection for good, on every device. `photo` is the
// Photo id, or the data URL the photo was added with.
message RemoveInspectionPhotoRequest {
  string inspection_id = 1;
  string photo = 2;
}
message RemoveInspectionPhotoResponse { Inspection inspection = 1; }

service InspectionService {
  rpc CreateInspection(CreateInspectionRequest) returns (CreateInspectionResponse);
  rpc ListInspections(ListInspectionsRequest) returns (ListInspectionsResponse);
  rpc UpdateInspection(UpdateInspectionRequest) returns (UpdateInspectionResponse);
  rpc DeleteInspection(DeleteInspectionRequest) returns (DeleteInspectionResponse);
  rpc AddInspectionPhoto(AddInspectionPhotoRequest) returns (AddInspectionPhotoResponse);
  rpc RemoveInspectionPhoto(RemoveInspectionPhotoRequest) returns (RemoveInspectionPhotoResponse);
}

// --- Treatment (Bestandsbuch / medicine documentation) ---
// The treatment service lives in treatment.proto.
message Treatment {
  string id = 1;
  string organization_id = 2;
  string apiary_id = 3;             // frozen context at application time
  string hive_id = 4;
  string queen_id = 5;              // frozen context (reigning queen)
  google.protobuf.Timestamp date = 6;        // applied on
  string product = 7;              // e.g. "Oxuvar 5.7%", "formic acid 60%"
  string active_ingredient = 8;    // e.g. "oxalic acid"
  string dose = 9;                 // e.g. "50 ml"
  string method = 10;              // e.g. "trickling", "sublimation", "strips"
  string batch_number = 11;        // batch / charge (legally required)
  google.protobuf.Timestamp withdrawal_until = 12; // honey safe again from
  string reason = 13;              // e.g. "varroa"
  string note = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp amended_at = 16; // time of the last correction; unset if never edited
}

// --- Harvest / honey batches ---
message Harvest {
  string id = 1;
  string organization_id = 2;
  string apiary_id = 3;
  google.protobuf.Timestamp date = 4;
  string variety = 5;         // spring flow, summer flow, forest, ...
  double amount_kg = 6;
  double water_content = 7;  // % (refractometer)
  string batch_number = 8;
  google.protobuf.Timestamp best_before = 9;
  string note = 10;
  string hive_id = 11;   // frozen context at harvest time
  string queen_id = 12;  // frozen context (reigning queen)
  google.protobuf.Timestamp amended_at = 13; // time of the last correction; unset if never edited
}
