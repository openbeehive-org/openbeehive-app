syntax = "proto3";

package openbeehive.v1;

// Sync protocol: devices upload their local changes with Push and download
// everybody else's with Pull. Rows are merged field by field (last writer
// wins per field), list columns as observed-remove sets.
//
// payload_json is a JSON object holding only the CHANGED columns of one row
// (a partial delta), never the whole row:
//   Scalars:  {"name": "Orchard Meadow", "note": "..."}
//             Values are strings, numbers, booleans or null. Booleans travel
//             as 0/1, timestamps as ISO-8601 strings ("" = not set).
//   Sets:     {"photo_keys": {"add": ["k1"], "remove": ["k2"],
//                             "removed_tags": {"k2": ["<hlc>", ...]}}}
//             removed_tags lists, per removed element, the add tags the
//             origin device had observed; only those are tombstoned, so a
//             concurrent add elsewhere survives. A delta WITHOUT
//             removed_tags (older apps) removes every tag the receiver
//             knows; a present but empty list removes nothing.
//
// The server keeps only the columns it knows (unknown keys are dropped), in
// a normalised form, and that normalised payload is what Pull returns.
// Receivers must ignore keys they do not know.
//
// hlc stamps the whole delta: "<unix ms, 15 digits>:<counter, 5 digits>:<node>".
// Per field the newer stamp wins; equal stamps do not overwrite.
//
// Protocol version. A client says which version of this protocol it speaks
// with two request headers on every call of SyncService:
//   Openbeehive-Sync-Protocol: 1        (an integer; this file describes 1)
//   Openbeehive-App-Version:   0.5.0    (free text, for the server log)
// A request without Openbeehive-Sync-Protocol comes from a 0.4.x app
// ("version 0"). Such a client is served as release 0.4.1 was: Pull returns
// only the entities and columns that release knew, cursors are plain
// sequence numbers, and it gets neither snapshots nor reset signals. Scripts
// that call this service must send the header to receive everything.
// The server may require a minimum version; below it every call fails with
// FAILED_PRECONDITION and an UpgradeRequired error detail.

enum ChangeOp {
  CHANGE_OP_UNSPECIFIED = 0;
  CHANGE_OP_UPSERT = 1;
  CHANGE_OP_DELETE = 2; // Tombstone: sets the row's "deleted" column
}

message Change {
  // "apiary" | "hive" | "queen" | "inspection" | "task" | "placement" |
  // "harvest" | "treatment" | "event"
  string entity = 1;
  string entity_id = 2;
  // Id of the apiary the row belongs to, or "user:<id>" for rows only their
  // author sees. Every change is additionally bound to the caller's workspace.
  string scope_id = 3;
  ChangeOp op = 4;
  string payload_json = 5; // partial delta, see above (ignored on delete)
  string hlc = 6;          // Hybrid Logical Clock stamp of the delta
  // Set by the server from the authenticated caller; what a client sends
  // here on Push is ignored.
  string author_id = 7;
}

// What the server made of the cursor of a Pull. Only clients that announce a
// protocol version receive a value other than UNSPECIFIED.
enum PullStatus {
  // The cursor was accepted: changes, next_cursor and has_more are valid.
  PULL_STATUS_UNSPECIFIED = 0;
  // The cursor is older than the oldest change the server still keeps (the
  // change log is compacted). Nothing was returned. Load the current rows
  // with Snapshot and continue from its cursor; the outbox is unaffected.
  PULL_STATUS_SNAPSHOT_REQUIRED = 1;
  // The cursor does not belong to the history of this database: it was
  // restored from a backup or replaced. Nothing was returned. Load the
  // current rows with Snapshot, continue from its cursor, and push the
  // local rows again (with their existing stamps) so that what the server
  // lost comes back.
  PULL_STATUS_RESET_REQUIRED = 2;
}

message PullRequest {
  // next_cursor of the previous Pull, or cursor of a Snapshot ("" = from the
  // start). Opaque: store it and send it back unchanged.
  string cursor = 1;
  int32 limit = 2;       // 0 => server default
}
message PullResponse {
  repeated Change changes = 1;
  string next_cursor = 2;
  bool has_more = 3;     // more pages available -> pull again immediately
  int64 server_time_ms = 4; // server wall clock (unix ms); devices correct their own clock with it
  PullStatus status = 5;
}

// Snapshot returns the current rows of the caller's workspace, page by page:
// every synced row including deleted ones (tombstones), and of the personal
// rows only the caller's own. A new device loads it instead of replaying the
// whole change log.
message SnapshotRequest {
  string page_token = 1; // next_page_token of the previous page ("" = first page)
}
message SnapshotRow {
  string entity = 1;
  string entity_id = 2;
  // Every synced column of the row, in the form of Change.payload_json. A
  // set column carries its whole state instead of a delta:
  //   {"photo_keys": {"<element>": {"a": ["<add tag>", ...], "r": ["<removed tag>", ...]}}}
  string payload_json = 3;
  // JSON object: column -> hlc stamp of its last write. Merge the row field
  // by field like a change: a column is taken when its stamp is newer than
  // the local one. A column without a stamp was never written through sync
  // and is taken only where the local row has no stamp for it either. Set
  // columns are merged by union of their tags.
  string field_hlc_json = 4;
}
message SnapshotResponse {
  repeated SnapshotRow rows = 1;
  string next_page_token = 2; // "" = this was the last page
  // Where to continue with Pull after the last page. The same on every page:
  // it is taken before the first row is read, so a row changed while the
  // pages are being fetched is delivered again by Pull.
  string cursor = 3;
  int64 server_time_ms = 4; // server wall clock (unix ms)
}

// Error detail of FAILED_PRECONDITION: the calling app is too old for this
// server and has to be updated before it can sync again.
message UpgradeRequired {
  int32 min_protocol = 1; // lowest protocol version the server accepts
}

message PushRequest {
  repeated Change changes = 1;
}
message Conflict {
  string entity = 1;
  string entity_id = 2;
  string winning_hlc = 3; // the server-side winning version
}
// One change of a Push that the server did not apply. Every other change of
// the same request is applied normally.
message RejectedChange {
  int32 index = 1; // position in PushRequest.changes
  // Machine-readable cause:
  //   "wrong_tenant"    the row belongs to another workspace
  //   "forbidden_scope" scope_id is not writable for the caller
  //   "unknown_entity"  entity is not a synced table
  //   "invalid"         malformed stamp, payload, value or id
  //   "clock_ahead"     hlc is more than 10 minutes ahead of the server;
  //                     re-stamp with a corrected clock and send again
  string code = 2;
  string reason = 3; // plain English, for logs
}
message PushResponse {
  // Always empty. The pull cursor only ever advances through Pull;
  // kept so older apps keep decoding the response.
  string server_cursor = 1;
  repeated Conflict conflicts = 2; // unused, always empty
  // Changes that were not applied. A change not listed here was accepted
  // (accepted does not mean it won: older fields lose the per-field merge).
  repeated RejectedChange rejected = 3;
  int64 server_time_ms = 4; // server wall clock (unix ms)
}

// Optional live channel: nudges the device to pull when its workspace has
// new changes. server_cursor is the sequence number of the newest change,
// for information only; it is not a cursor for Pull.
message SubscribeRequest { string cursor = 1; }
message SubscribeEvent { string server_cursor = 1; }

service SyncService {
  rpc Pull(PullRequest) returns (PullResponse);
  // Requires a protocol version (see the top of this file).
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  // Applies each change on its own: one bad change neither blocks nor drops
  // the others (see PushResponse.rejected). The whole request fails with
  // PERMISSION_DENIED only for read-only identities.
  rpc Push(PushRequest) returns (PushResponse);
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeEvent);
}
