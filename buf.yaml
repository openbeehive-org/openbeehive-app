version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    - FIELD_LOWER_SNAKE_CASE
    # The 0.3 contract shipped DashboardRequest/HoneyStatsRequest/SubscribeEvent; renaming them breaks clients.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
  ignore_only:
    # Inspection counts, amounts and climate readings became `optional` so an
    # unset value ("not recorded") differs from an observed 0. The wire format
    # is the same and clients built against the previous contract keep working;
    # only regenerated stubs see the new presence accessors. The check compares
    # against the last release tag, so drop this once 0.5.0 is tagged.
    FIELD_SAME_CARDINALITY:
      - proto/openbeehive/v1/inspection.proto
