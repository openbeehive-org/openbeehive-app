version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    - FIELD_LOWER_SNAKE_CASE
    # The 0.3 contract shipped DashboardRequest/HoneyStatsRequest/SubscribeEvent; renaming them breaks clients.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
